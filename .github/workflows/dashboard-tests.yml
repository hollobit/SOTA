name: Dashboard Tests

on:
  push:
    paths:
      - 'dashboard/js/**'
      - 'dashboard/tests/**'
      - 'dashboard/**'
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/dashboard-tests.yml'
  pull_request:
    paths:
      - 'dashboard/js/**'
      - 'dashboard/tests/**'
      - 'dashboard/**'
      - 'scripts/**'
      - 'config/**'
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"   # every Monday 05:00 UTC

permissions:
  contents: read

jobs:
  peer-matcher-tests:
    name: Peer matcher (node assert)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run peer-matcher tests
        run: node dashboard/js/__tests__/peer-matcher.test.js

  python-tests:
    name: Python unit tests (schema + exporter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run pytest
        run: python -m pytest tests/test_model_schema_extensions.py tests/test_enrichment_export.py -v

  hf-metadata-fetch:
    name: HuggingFace metadata refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Fetch HF metadata
        run: python3 scripts/fetch_hf_metadata.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/export/hf_metadata.json)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/export/hf_metadata.json
            git commit -m 'data(hf): refresh metadata via HuggingFace API'
            git push origin ops
          else
            echo 'No changes to commit'
          fi

  schema-validate:
    name: Validate enrichment schema
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install jsonschema pyyaml
      - name: Validate
        run: python3 scripts/validate_enrichment.py

  arena-elo-refresh:
    name: Arena Elo refresh (placeholder)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run placeholder refresh
        run: python3 scripts/refresh_arena_elo.py

  badge-refresh:
    name: Refresh README badge
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pyyaml
      - name: Update badge
        run: python3 scripts/update_coverage_badge.py
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'docs(readme): refresh enrichment coverage badge'
            git push origin ops
          else
            echo 'No README changes'
          fi
