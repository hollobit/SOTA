  - url: "https://arxiv.org/abs/2511.04860"
    name: "Palisade Research — GPT-5 at CTFs (arxiv 2511.04860)"
    type: paper
    format: pdf
    notes: "First peer-reportable live-CTF evaluation of a frontier LLM (Reworr/Petrov/Volkov, Palisade Research, Nov 2025). Team [AI] Palisade Research entered GPT-5 Pro into 3 top-weighted 2025 CTFTime events: ASIS CTF Quals (25/368 = 93rd pct), CorCTF (49/474 = 90th), snakeCTF Quals (43/518 = 92nd). Newly-created challenges (no train-data memorization). At ASIS, placed between The Flat Network Society (#3 worldwide) and thehackerscrew (#7 worldwide)."
  - url: "https://palisaderesearch.github.io/gpt5-ctfs"
    name: "Palisade Research — gpt5-ctfs project page"
    type: research_page
    format: html_table
    notes: "Companion site hosting full transcripts + per-challenge solutions: Empties (polynomial-ring cryptanalysis ~8% human solve), Triple Flavor (cascade-cipher cryptanalysis), Control (WASM industrial-systems exploitation ~9% human solve)."
  - url: "https://qwen.ai/blog?id=qwen3.7"
    name: "Qwen3.7-Max launch blog"
    type: vendor_page
    format: html_table
    notes: "Alibaba Qwen Team launch blog (May 20 2026). 41-benchmark × 6-model comparison: Opus-4.6 Max / K2.6 Thinking / GLM-5.1 Thinking / DS-V4-Pro Max / Qwen3.6-Plus / Qwen3.7-Max. AAII 57 (#1 tier with GPT-5.4 Pro / Opus 4.7 / Gemini 3.1 Pro). New Qwen-internal benches: QwenWebDev, QwenSVG, Qwenclaw, CoWorkBench, Vitabench, SpreadSheetBench-v1, KernelBench L3, QwenWorldBench, MAXIFE, MMLU-ProX, NOVA-63, PolyMATH (12 new bench IDs). Qwen3.7-Max wins #1 on 18/41 benches including Apex (+6.2 vs DS-V4-Pro Max), MRCR-128k (+6.4 vs Opus 4.6 Max long-context recall), IFBench (+3.1), PolyMATH (+3.8). DEEP-DIVE additions: YC-Bench startup-management simulator ($2.08M / 237 tasks vs Qwen3.6 $1.05M vs Qwen3.5 $352K); KernelBench L3 speedup component (Qwen3.7-Max 1.98x at 96% pass-rate); Qwen-RobotClaw + Qwen-RobotNav robotics models for quadruped tool-use; Self-Evolving kernel optimization case study (10.0x geomean speedup on unseen T-Head ZW-M890 PPU after 35hr/432 evals); Reward Hacking Monitoring for 80hr SWE-RL (1,618 hacking cases flagged, 13 self-evolved rules)."
  - url: "https://artificialanalysis.ai/models/qwen3-7-max"
    name: "Artificial Analysis — Qwen3.7 Max model detail"
    type: leaderboard
    format: html_table
    notes: "AA model detail page surfacing Qwen-reported AAII = 57. Disclaimer 'Results claimed by AI Lab (not yet independently verified)' — AA re-displays the Qwen blog primary source, hasn't run their own evals yet."
  - url: "https://deploymentsafety.openai.com/gpt-5-4-thinking"
    name: "OpenAI Deployment Safety — GPT-5.4 Thinking"
    type: vendor_page
    format: html_table
    notes: "Living-document safety hub (post-System-Card framework). Full Preparedness Framework on GPT-5.4 Thinking (released Mar 5 2026): Biology MCQ Virology 50.4 / ProtocolQA-OE 42.5 / Tacit Knowledge 65.0 / TroubleshootingBench 35.8 / OPQA 4.16. Cyber CTF pass@12 88.2 / CVE-Bench 86.3 / Cyber Range 73.3 / Irregular Network 88 Vuln-Research 73 Evasion 48 / CyScenarioBench 5-of-11. Apollo deception sabotage 0.56 / eval-awareness 21.3. Also documents GPT-5.4 Mini eval (released Mar 17): Virology 46.5 / ProtocolQA 33.6 / Tacit 71.7 / Troubleshoot 31.9 / OPQA 7.5 / CTF pass@12 81.3. New benchmarks introduced: Production-with-Representative-Prompts, Dynamic mental-health adversarial sims, CoT-Control suite (13k tasks), CyScenarioBench (Irregular), TroubleshootingBench (52 protocols × 156 questions)."
  - url: "https://deploymentsafety.openai.com/gpt-5-5-instant"
    name: "OpenAI Deployment Safety — GPT-5.5 Instant"
    type: vendor_page
    format: html_table
    notes: "Living-document safety hub for GPT-5.5 Instant (released May 5 2026) — first Instant-family model classified High Capability in cyber+bio. Production safety 8 categories (challenging prompts): Violent Illicit 0.934 / Nonviolent 0.957 / Extremism 0.943 / Hate 0.827 / Self-harm 0.878 / Gore 0.703 / Sexual 0.806 / Sexual-Minors 0.810 (Gore + Sexual stat-significantly regressed vs gpt-5.3-instant). HealthBench length-adjusted: 51.4 / Hard 22.9 / Consensus 94.7 / Professional 38.4 (+1.8 to +5.5 vs gpt-5.3-instant). First-Person Fairness 0.0101. Cyber Range 76.9% (vs gpt-5.5-Thinking 92.3%). Jailbreak robustness regression vs gpt-5.3-instant noted as directional."
  - url: "https://deploymentsafety.openai.com/chatgpt-images-2-0"
    name: "OpenAI Deployment Safety — ChatGPT Images 2.0"
    type: vendor_page
    format: html_table
    notes: "Image-generation model + Thinking variant (released Apr 21 2026). Successor to GPT-4o Image Gen 1.0 + ChatGPT Images 1.5. Image-safety pipeline metrics: violative output rate 22.0% (base) / 6.7% (thinking, 3.3x lower); image-layer detection 87.3 / 76.9; prompt-layer 77.2 / 47.8; combined detection 96.1 / 87.5; safe output rate 99.1 / 99.2. Thinking variant produces fewer policy-edge outputs but the remaining violative ones are harder to flag (12.5% remaining undetected vs 3.9%). Biological risk monitor 'comparable to live text-based safety system' on 772-image eval set."
