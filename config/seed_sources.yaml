  - url: "https://www.industry.gov.au/science-technology-and-innovation/technology/artificial-intelligence/ai-safety-science"
    name: "Australia AISI (DISR)"
    type: evaluation_report
    format: html_table
    notes: "Australian AI Safety Institute under Department of Industry, Science and Resources. Operational early 2026, A$30M budget. Evaluates emerging AI capabilities, advises industry/agencies/ministers. Joined International Network of AISIs at Vancouver Jul 2025 directors-level meeting"
  - url: "https://ised-isde.canada.ca/site/ised/en/canadian-artificial-intelligence-safety-institute"
    name: "Canada AISI / CAISI Canada (ISED)"
    type: evaluation_report
    format: html_table
    notes: "Canadian Artificial Intelligence Safety Institute under Innovation, Science and Economic Development Canada. C$50M over 5 years. NRC research arm + CIFAR scientific engine. Founding member of International Network. Focus: synthetic content risks, dangerous systems, AI safety guidance. Contact CAISI-ICSIA@ised-isde.gc.ca"
  - url: "https://cifar.ca/ai/caisi/"
    name: "CAISI Research Program (CIFAR)"
    type: evaluation_report
    format: html_table
    notes: "Canadian AISI's independent scientific engine. 2026 research calls: interpretability, robustness testing, AI cybersecurity misuse. 2025 Year-in-Review report at report.buildingsafeai.ca"
  - url: "https://www.inria.fr/en/ai-security-and-sovereignty-inesia-unveils-its-roadmap-2026-2027"
    name: "France INESIA"
    type: evaluation_report
    format: html_table
    notes: "Institut national pour l'évaluation et la sécurité de l'intelligence artificielle. Federation of ANSSI + LNE + PEReN + Inria, piloted by SGDSN (PM office) + DGE (Min. of Economy). Created Jan 31 2025. 2026-2027 roadmap: systemic-risk analysis, AI Act implementation support, model performance and reliability evaluation. AGENTIA AI agent eval Jul 2025"
  - url: "https://indiaai.gov.in/article/india-takes-the-lead-establishing-the-indiaai-safety-institute-for-responsible-ai-innovation"
    name: "India AISI (IndiaAI / MeitY)"
    type: evaluation_report
    format: html_table
    notes: "IndiaAI Safety Institute under MeitY (Ministry of Electronics & IT). Announced Jan 30 2025 by Minister Ashwini Vaishnaw. Hub-and-spoke model with academic + private-sector partner Cells (call for partners May 2025). 7-Sutras techno-legal framework launched at India AI Impact Summit 2026. Indigenous R&D on AI governance for the developing world"
  - url: "https://digital-strategy.ec.europa.eu/en/policies/ai-office"
    name: "EU AI Office"
    type: evaluation_report
    format: html_table
    notes: "European Commission's AI expertise centre. Implements EU AI Act for general-purpose AI models. GPAI obligations applicable Aug 2 2025; high-risk system rules Aug 2 2026. Council + Parliament simplification deal May 7 2026 (Digital Omnibus). Founding member of International Network of AISIs"
  - url: "https://ised-isde.canada.ca/site/ised/en/international-network-ai-safety-institutes-mission-statement"
    name: "AISI International Network — Mission"
    type: evaluation_report
    format: html_table
    notes: "10 founding members announced Nov 2024 San Francisco convening: US, UK, Japan, Singapore, Korea, Australia, Canada, France, EU, Kenya. Vancouver 2nd convening Jul 2025. Capacity Building Programme → mini-AISIs and regional hubs in Africa, Southeast Asia, Latin America"
  - url: "https://sgaisi.sg/resources/international-joint-testing-exercise-agentic-testing-evaluation-report/"
    name: "3rd Joint Testing Exercise — Agentic Evaluation Report"
    type: evaluation_report
    format: pdf
    notes: "Singapore AISI lead (leakage/fraud) + UK AISI lead (cybersecurity). Jul 17 2025. ~1,500 tasks and ~1,200 tools. Used Cybench + Intercode benchmarks. Models anonymized A-F (open vs closed); reported pass rates ~57% (Model A) and ~35% (Model B) for leakage/fraud; judge model discrepancy 23%/28% vs human. 9 participating institutes: SG, JP, AU, CA, EC, FR, KE, KR, UK. NOT ingestable as model scores due to anonymization"
  - url: "https://www.industry.gov.au/publications/research-agenda-risks-synthetic-content"
    name: "Synthetic Content Research Agenda (DISR + ISED)"
    type: evaluation_report
    format: pdf
    notes: "International Network research track co-led by Australia (DISR) + Canada (CAISI). Published Jul 14 2025. Scope of risks, current state of science, research priorities for AI-generated synthetic content (deepfakes, impersonation, fraud). Mirror at ised-isde.canada.ca/site/ised/en/canadian-artificial-intelligence-safety-institute/research-agenda-risks-synthetic-content"
  - url: "https://code-of-practice.ai/"
    name: "GPAI Code of Practice (Final)"
    type: evaluation_report
    format: html_table
    notes: "EU AI Office voluntary compliance tool for general-purpose AI providers under EU AI Act. Final version published Jul 10 2025. Three chapters: Transparency, Copyright, Safety & Security. Full signatories: Anthropic, Google, IBM, Microsoft, OpenAI, Amazon, Mistral, Aleph Alpha. Partial: xAI (Safety & Security only). Declined: Meta. Safety & Security chapter applies above 10^25 FLOP. Enforcement begins Aug 2 2026"
  - url: "https://digital-strategy.ec.europa.eu/en/policies/signatory-taskforce-gpai-code-practice"
    name: "GPAI Code of Practice — Signatory Taskforce"
    type: evaluation_report
